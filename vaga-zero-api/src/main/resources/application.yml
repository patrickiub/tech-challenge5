spring:
  application:
    name: vaga-zero-api

  datasource:
    url: jdbc:postgresql://${VAGAZERO_DB_HOST:localhost}:${VAGAZERO_DB_PORT:5432}/${VAGAZERO_DB_NAME:vagazero}
    username: ${VAGAZERO_DB_USER:vagazero}
    password: ${VAGAZERO_DB_PASSWORD:vagazero}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
