spring:
  application:
    name: vaga-zero-api

  datasource:
    url: jdbc:postgresql://${VAGAZERO_DB_HOST:localhost}:${VAGAZERO_DB_PORT:5432}/${VAGAZERO_DB_NAME:vagazero}
    username: ${VAGAZERO_DB_USER:vagazero}
    password: ${VAGAZERO_DB_PASSWORD:vagazero}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${VAGAZERO_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: vaga-zero-api
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: br.com.fiap.vagazero.shared.evento
        spring.json.use.type.headers: true

vagazero:
  jwt:
    secret: ${VAGAZERO_JWT_SECRET:vaga-zero-hackathon-fiap-fase5-chave-secreta-desenvolvimento-32bytes}
    expiracao-minutos: ${VAGAZERO_JWT_EXPIRACAO_MINUTOS:60}
  convite:
    ttl-segundos: ${VAGAZERO_CONVITE_TTL_SEGUNDOS:1800}
    scheduler-intervalo-ms: ${VAGAZERO_CONVITE_SCHEDULER_INTERVALO_MS:2000}
  risco:
    scheduler-intervalo-ms: ${VAGAZERO_RISCO_SCHEDULER_INTERVALO_MS:3600000}
  scoring:
    pontos-por-falta: ${VAGAZERO_SCORING_PONTOS_POR_FALTA:25}
    teto-pontos-faltas: ${VAGAZERO_SCORING_TETO_PONTOS_FALTAS:50}
    distancia-limite-km: ${VAGAZERO_SCORING_DISTANCIA_LIMITE_KM:10}
    pontos-distancia-acima-limite: ${VAGAZERO_SCORING_PONTOS_DISTANCIA:15}
    antecedencia-limite-dias: ${VAGAZERO_SCORING_ANTECEDENCIA_LIMITE_DIAS:30}
    pontos-antecedencia-acima-limite: ${VAGAZERO_SCORING_PONTOS_ANTECEDENCIA:10}
    pontos-primeira-consulta-especialidade: ${VAGAZERO_SCORING_PONTOS_PRIMEIRA_CONSULTA:10}
    idade-minima: ${VAGAZERO_SCORING_IDADE_MINIMA:18}
    idade-maxima: ${VAGAZERO_SCORING_IDADE_MAXIMA:30}
    pontos-faixa-etaria: ${VAGAZERO_SCORING_PONTOS_FAIXA_ETARIA:5}
    pontos-confirmacao-presenca: ${VAGAZERO_SCORING_PONTOS_CONFIRMACAO:-40}
    limite-baixo-medio: ${VAGAZERO_SCORING_LIMITE_BAIXO_MEDIO:30}
    limite-medio-alto: ${VAGAZERO_SCORING_LIMITE_MEDIO_ALTO:60}
  notificacao:
    base-url: ${VAGAZERO_NOTIFICACAO_BASE_URL:http://localhost:8081}
    timeout-ms: ${VAGAZERO_NOTIFICACAO_TIMEOUT_MS:1000}
    reenvio-intervalo-ms: ${VAGAZERO_NOTIFICACAO_REENVIO_INTERVALO_MS:3000}

resilience4j:
  retry:
    retry-aspect-order: 1
    instances:
      notificacao:
        max-attempts: ${VAGAZERO_NOTIFICACAO_RETRY_TENTATIVAS:2}
        wait-duration: ${VAGAZERO_NOTIFICACAO_RETRY_ESPERA_MS:200}ms
  circuitbreaker:
    circuit-breaker-aspect-order: 2
    instances:
      notificacao:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${VAGAZERO_NOTIFICACAO_CB_JANELA:4}
        minimum-number-of-calls: ${VAGAZERO_NOTIFICACAO_CB_MIN_CHAMADAS:2}
        failure-rate-threshold: ${VAGAZERO_NOTIFICACAO_CB_LIMIAR_FALHA:50}
        wait-duration-in-open-state: ${VAGAZERO_NOTIFICACAO_CB_ESPERA_ABERTO_MS:5000}ms
        permitted-number-of-calls-in-half-open-state: ${VAGAZERO_NOTIFICACAO_CB_CHAMADAS_HALF_OPEN:1}
        automatic-transition-from-open-to-half-open-enabled: true

springdoc:
  swagger-ui:
    tags-sorter: alpha

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: never
