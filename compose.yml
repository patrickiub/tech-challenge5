services:
  postgres:
    image: postgres:16
    container_name: vaga-zero-postgres
    environment:
      POSTGRES_DB: vagazero
      POSTGRES_USER: vagazero
      POSTGRES_PASSWORD: vagazero
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagazero -d vagazero"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: vaga-zero-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: VagaZero0KRaftClusterId0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  vaga-zero-api:
    build:
      context: .
      dockerfile: vaga-zero-api/Dockerfile
    container_name: vaga-zero-api
    environment:
      VAGAZERO_DB_HOST: postgres
      VAGAZERO_DB_PORT: "5432"
      VAGAZERO_DB_NAME: vagazero
      VAGAZERO_DB_USER: vagazero
      VAGAZERO_DB_PASSWORD: vagazero
      VAGAZERO_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      VAGAZERO_JWT_SECRET: vaga-zero-hackathon-fiap-fase5-chave-secreta-desenvolvimento-32bytes
      VAGAZERO_JWT_EXPIRACAO_MINUTOS: "60"
      VAGAZERO_CONVITE_TTL_SEGUNDOS: "20"
      VAGAZERO_CONVITE_SCHEDULER_INTERVALO_MS: "2000"
      VAGAZERO_RISCO_SCHEDULER_INTERVALO_MS: "3000"
      SPRING_PROFILES_ACTIVE: demo
      VAGAZERO_NOTIFICACAO_BASE_URL: http://notificacao-service:8081
      VAGAZERO_NOTIFICACAO_TIMEOUT_MS: "1000"
      VAGAZERO_NOTIFICACAO_RETRY_TENTATIVAS: "2"
      VAGAZERO_NOTIFICACAO_RETRY_ESPERA_MS: "200"
      VAGAZERO_NOTIFICACAO_CB_JANELA: "4"
      VAGAZERO_NOTIFICACAO_CB_MIN_CHAMADAS: "2"
      VAGAZERO_NOTIFICACAO_CB_LIMIAR_FALHA: "50"
      VAGAZERO_NOTIFICACAO_CB_ESPERA_ABERTO_MS: "5000"
      VAGAZERO_NOTIFICACAO_CB_CHAMADAS_HALF_OPEN: "1"
      VAGAZERO_NOTIFICACAO_REENVIO_INTERVALO_MS: "3000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      notificacao-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  notificacao-service:
    build:
      context: .
      dockerfile: notificacao-service/Dockerfile
    container_name: vaga-zero-notificacao
    environment:
      VAGAZERO_NOTIFICACAO_CHAOS_DELAY_MS: "3000"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
  kafka-data:
